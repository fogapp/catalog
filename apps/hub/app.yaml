id: hub
title: Hub
description: Family operating system — people, chronicle, documents, todos, podcasts.
category: Personal cloud
icon: '🏡'
spec:
  source:
    type: git
    branch: main
    buildArgs:
      GIT_REV: '{{commit}}'
  env:
    GIT_REV: '{{commit}}'
    HUB_BASE_URL: https://{{fqdn}}
    SOLID_QUEUE_IN_PUMA: "1"
  secrets:
    - SECRET_KEY_BASE
    - AR_ENCRYPTION_PRIMARY_KEY
    - AR_ENCRYPTION_DETERMINISTIC_KEY
    - AR_ENCRYPTION_KEY_DERIVATION_SALT
  volumes:
    - name: storage
      mount: /rails/storage
      owner: 1000:1000
    - name: immich-cache
      mount: /rails/immich_cache
      owner: 1000:1000
  routes:
    - port: 80
      noBuffer: true
  health:
    path: /up
  release:
    - ./bin/rails
    - fog:release
  needs:
    postgres:
      databases:
        - hub_production
        - hub_production_cache
        - hub_production_queue
      extensions:
        - pg_trgm
      inject:
        DATABASE_HOST: host
        DATABASE_PASSWORD: password
        DATABASE_PORT: port
        DATABASE_USER: user
  backup:
    enabled: true
    mode: delegated
    timeout: 45m
  notes: 'First run: open the app and the setup wizard creates your household and admin account — or restores a fog-backup/1 artifact from a previous instance. Blobs default to the managed volume at /rails/storage; only change Settings → Storage if you know where you''re pointing it.'
options:
  - key: repo
    label: Git repository
    target: repo
    required: true
  - key: SECRET_KEY_BASE
    label: SECRET_KEY_BASE
    hint: Signs cookies and ActiveStorage URLs; unique per instance.
    target: secret:SECRET_KEY_BASE
    required: true
    generate: hex128
  - key: AR_ENCRYPTION_PRIMARY_KEY
    label: AR_ENCRYPTION_PRIMARY_KEY
    hint: Encrypts sensitive database columns from day one.
    target: secret:AR_ENCRYPTION_PRIMARY_KEY
    required: true
    generate: alnum32
  - key: AR_ENCRYPTION_DETERMINISTIC_KEY
    label: AR_ENCRYPTION_DETERMINISTIC_KEY
    target: secret:AR_ENCRYPTION_DETERMINISTIC_KEY
    required: true
    generate: alnum32
  - key: AR_ENCRYPTION_KEY_DERIVATION_SALT
    label: AR_ENCRYPTION_KEY_DERIVATION_SALT
    target: secret:AR_ENCRYPTION_KEY_DERIVATION_SALT
    required: true
    generate: alnum32
companions:
  - id: immich
    blurb: Photo & video library — Hub pulls photos from Immich into its chronicle.
  - id: paperless
    blurb: Searchable document archive behind Hub's documents features.
  - id: whisper
    blurb: Speech-to-text server Hub uses to transcribe podcast audio.
firstParty: hub
about: |-
  Hub is a private home base for a household: the people, plans, and paperwork that keep the place running. One household per instance, one login per person, and everything else — photos, calendars, mail, documents — pulled in from the self-hosted services you already run.

  The dashboard is a shared chronicle: a journal with mentions, photos, comments, and reactions, alongside who lives here, what is coming up, and the photo days Hub thinks are worth writing up.
highlights:
  - 'People and pets: contacts, places, health, education, and a derived family tree'
  - Calendars of its own plus CalDAV, ICS subscriptions, and a wall-tablet kiosk view
  - Vaults for property, vehicles, insurance, accounts, and documents, with expiry reminders
  - Todos as kanban boards with checklists and links to any record
  - Pulls photos from Immich and documents from Paperless into the chronicle
  - Transcribes podcasts through Whisper
logo: tile.svg
developer: Built from your own repository
license: Private
footprint:
  memory: 734003200
  memoryPeak: 1572864000
  cpu: moderate
  cpuWhen: importing photos and mail
  disk: 1258291200
  diskGrows: with the chronicle's photos and files
