id: signet
title: Signet
description: Save anything from any device in one gesture, with why you saved it — and get it back when it matters, including inside your AI agent sessions.
category: Personal cloud
icon: '🔖'
spec:
  source:
    type: git
    branch: main
    dockerfile: Dockerfile
    buildArgs:
      GIT_REV: '{{commit}}'
  env:
    SIGNET_PUBLIC_URL: https://{{fqdn}}
  secrets:
    - SIGNET_TOKEN
  volumes:
    - name: data
      mount: /data
      owner: 1000:1000
  routes:
    - port: 7717
      noBuffer: true
  health:
    path: /up
  deployStrategy: restart
  updatePolicy: auto
  backup:
    enabled: true
  notes: SIGNET_TOKEN (Config → Secrets) is the bootstrap admin token — use it once to mint a scoped token per client (`signet token create laptop --scopes read,capture,write`), and don't hand it to clients. The browser extension, Mac and iOS apps and the Claude Code plugin all take this app's address and a token. Embeddings auto-detect an Ollama; set SIGNET_EMBED_PROVIDER and SIGNET_EMBED_URL in Config → Environment to point elsewhere, and ANTHROPIC_API_KEY as a secret for summaries. Add the deploy key and webhook (Overview tab) to the Gitea repo for push-to-deploy.
  memoryLimit: 768m
options:
  - key: repo
    label: Git repository
    target: repo
    required: true
  - key: SIGNET_TOKEN
    label: SIGNET_TOKEN
    hint: The bootstrap admin token; mint per-client tokens with it.
    target: secret:SIGNET_TOKEN
    required: true
    generate: hex64
firstParty: signet
about: |-
  Signet is personal capture-and-recall: save a page, a thought, a screenshot or a video from any device in one gesture, along with why and where you saved it — and get it back exactly when it matters.

  Search blends keywords with meaning over everything you have saved, and an MCP server brings your library into AI agent sessions. Every item is also mirrored to plain files, readable without Signet.
highlights:
  - Save from the browser, Mac, iPhone, email or Telegram
  - Remembers why you saved something, not just what
  - Hybrid keyword and semantic search
  - Recall inside Claude Code and other MCP clients
  - A plain-file vault that outlives the database
logo: tile.svg
developer: Built from your own repository
license: Private
footprint:
  memory: 157286400
  memoryPeak: 805306368
  cpu: moderate
  cpuWhen: enriching new saves
  disk: 209715200
  diskGrows: with snapshots of what you save
