id: hook
title: Hook
description: Acquisition engine for ebooks and audiobooks — say what you want, Hook grabs the right edition and hands it to BookOrbit.
category: Media automation
icon: '🪝'
spec:
  source:
    type: git
    branch: main
    buildArgs:
      GIT_REV: '{{commit}}'
  env:
    GIT_SHA: '{{commit}}'
    HOOK_HOST: '{{fqdn}}'
    JOB_CONCURRENCY: "1"
    NTFY_TOPIC: hook
    NTFY_URL: http://ntfy
    RAILS_ENV: production
    RAILS_MAX_THREADS: "8"
    TIME_ZONE: America/Los_Angeles
  secrets:
    - SECRET_KEY_BASE
    - AR_ENCRYPTION_PRIMARY_KEY
    - AR_ENCRYPTION_DETERMINISTIC_KEY
    - AR_ENCRYPTION_KEY_DERIVATION_SALT
  volumes:
    - name: storage
      mount: /rails/storage
      owner: 1000:1000
    - name: content
      mount: /data
      files: Content
  routes:
    - port: 80
  health:
    path: /up
  processes:
    - name: worker
      command:
        - ./bin/jobs
  release:
    - ./bin/rails
    - fog:release
  deployStrategy: swap
  needs:
    postgres:
      databases:
        - hook_production
        - hook_production_cache
        - hook_production_queue
      extensions:
        - pg_trgm
        - citext
        - pgcrypto
      inject:
        DATABASE_HOST: host
        DATABASE_NAME: dbname
        DATABASE_PASSWORD: password
        DATABASE_PORT: port
        DATABASE_USER: user
  updatePolicy: auto
  backup:
    enabled: true
    mode: delegated
    timeout: 20m
  notes: 'First visit: complete the setup wizard to create the household and admin account — or restore a fog-backup/1 artifact from a previous instance. Then Settings → Indexers (your Newznab indexers, or point Hook at Prowlarr). SABnzbd, Stream and BookOrbit installed on this server are connected from Hook''s Integrations tab: Hook adds SABnzbd as a download client and finds each library''s folders on its own, with no paths to enter. BookOrbit''s login is still entered in Settings → Libraries. Add the deploy key and webhook (Overview tab) to the Gitea repo for push-to-deploy.'
  memoryLimit: 1g
  reach:
    - ntfy
options:
  - key: repo
    label: Git repository
    target: repo
    required: true
  - key: content
    label: Content folder
    hint: Drive's Content — downloads and libraries. Hook reads finished downloads and files them into the libraries here.
    target: volume:content
    required: false
  - key: SECRET_KEY_BASE
    label: SECRET_KEY_BASE
    hint: Signs cookies and ActiveStorage URLs; unique per instance.
    target: secret:SECRET_KEY_BASE
    required: true
    generate: hex128
  - key: AR_ENCRYPTION_PRIMARY_KEY
    label: AR_ENCRYPTION_PRIMARY_KEY
    hint: Encrypts sensitive database columns from day one.
    target: secret:AR_ENCRYPTION_PRIMARY_KEY
    required: true
    generate: alnum32
  - key: AR_ENCRYPTION_DETERMINISTIC_KEY
    label: AR_ENCRYPTION_DETERMINISTIC_KEY
    target: secret:AR_ENCRYPTION_DETERMINISTIC_KEY
    required: true
    generate: alnum32
  - key: AR_ENCRYPTION_KEY_DERIVATION_SALT
    label: AR_ENCRYPTION_KEY_DERIVATION_SALT
    target: secret:AR_ENCRYPTION_KEY_DERIVATION_SALT
    required: true
    generate: alnum32
companions:
  - id: sabnzbd
    blurb: Usenet downloader — Hook hands NZBs to it and reads the finished files back.
    default: true
  - id: prowlarr
    blurb: Indexer manager — Hook can pull its book-capable indexers straight from Prowlarr.
  - id: bookorbit
    blurb: Library and reading platform — where Hook delivers finished books.
  - id: ntfy
    blurb: Push notifications — Hook publishes grab and review alerts to ntfy.
firstParty: hook
about: |-
  Hook is an acquisition engine for ebooks and audiobooks. You tell it what you want — a book, an author, a series — and it obtains the right edition from the usenet indexers you subscribe to, through the download client you already run, and hands the finished file to BookOrbit, where you actually read.

  It fills the role Readarr played in a media stack, built so that a single closed metadata proxy can never kill it, and so that every step between “I want this” and “it is on my shelf” is legible and self-correcting.
highlights:
  - Wants, profiles, and monitors for authors and series
  - A scored decision engine that explains every grab
  - A failure ladder that retries, substitutes, and asks for help in that order
  - Indexers from Prowlarr, downloads through SABnzbd, delivery to BookOrbit
  - Credentials stored encrypted in Settings, never in environment variables
  - Grab and review alerts through ntfy
logo: tile.svg
developer: Built from your own repository
license: Private
footprint:
  memory: 524288000
  memoryPeak: 1048576000
  cpu: light
  disk: 1258291200
