id: once
title: Once
description: One second a day from Immich — pick the people and the dates, arrange the days, and get one film with music.
category: Personal cloud
icon: '🎞️'
spec:
  source:
    type: git
    branch: main
    dockerfile: Dockerfile
    buildArgs:
      GIT_REV: '{{commit}}'
  env:
    APP_PUBLIC_URL: https://{{fqdn}}
    GIT_SHA: '{{commit}}'
    LUCID_URL: http://lucid
    ONCE_CACHE_DIR: /data/cache
    ONCE_CACHE_MAX_GB: "20"
    ONCE_FILMS_DIR: /data/videos/Once
    ONCE_SOUNDTRACKS_DIR: /data/soundtracks
    RAILS_ENV: production
    RAILS_MAX_THREADS: "8"
    RENDER_PARALLEL: "2"
    RENDER_THREADS: "2"
    TIME_ZONE: America/Los_Angeles
  secrets:
    - SECRET_KEY_BASE
    - AR_ENCRYPTION_PRIMARY_KEY
    - AR_ENCRYPTION_DETERMINISTIC_KEY
    - AR_ENCRYPTION_KEY_DERIVATION_SALT
  volumes:
    - name: storage
      mount: /rails/storage
      owner: 1000:1000
    - name: soundtracks
      mount: /data/soundtracks
      owner: 1000:1000
    - name: cache
      mount: /data/cache
      owner: 1000:1000
    - name: videos
      mount: /data/videos
      files: Content/Videos
  routes:
    - port: 80
      noBuffer: true
  health:
    path: /up
  processes:
    - name: worker
      command:
        - ./bin/jobs
    - name: renderer
      command:
        - ./bin/jobs
        - -c
        - config/queue.render.yml
        - --skip-recurring
  release:
    - ./bin/rails
    - fog:release
  deployStrategy: swap
  needs:
    postgres:
      databases:
        - once_production
        - once_production_cache
        - once_production_queue
      extensions:
        - pgcrypto
        - citext
      inject:
        DATABASE_HOST: host
        DATABASE_NAME: dbname
        DATABASE_PASSWORD: password
        DATABASE_PORT: port
        DATABASE_USER: user
  updatePolicy: auto
  backup:
    enabled: true
    mode: delegated
    timeout: 20m
  notes: 'First visit: sign in with fog — the first person to do so is Once''s admin — or, off fog, complete the setup wizard or restore a fog-backup/1 artifact. Then connect Immich: make an API key in Immich (person.read, asset.read, asset.view, asset.download; asset.upload and the album permissions to save films back) and add it as Immich''s IMMICH_API_KEY secret here — Once picks it up within five minutes — or paste Immich''s address and the key into Once''s Settings › Immich. Finished films land in Content/Videos/Once. Add the deploy key and webhook (Overview tab) to the Gitea repo for push-to-deploy.'
  memoryLimit: 2g
  uses:
    - immich
options:
  - key: repo
    label: Git repository
    target: repo
    required: true
  - key: videos
    label: Videos folder
    hint: Drive's video library. Once saves finished films in a Once folder inside it, mounted at /data/videos.
    target: volume:videos
    required: false
  - key: SECRET_KEY_BASE
    label: SECRET_KEY_BASE
    hint: Signs cookies and ActiveStorage URLs; unique per instance.
    target: secret:SECRET_KEY_BASE
    required: true
    generate: hex128
  - key: AR_ENCRYPTION_PRIMARY_KEY
    label: AR_ENCRYPTION_PRIMARY_KEY
    hint: Encrypts sensitive database columns from day one.
    target: secret:AR_ENCRYPTION_PRIMARY_KEY
    required: true
    generate: alnum32
  - key: AR_ENCRYPTION_DETERMINISTIC_KEY
    label: AR_ENCRYPTION_DETERMINISTIC_KEY
    target: secret:AR_ENCRYPTION_DETERMINISTIC_KEY
    required: true
    generate: alnum32
  - key: AR_ENCRYPTION_KEY_DERIVATION_SALT
    label: AR_ENCRYPTION_KEY_DERIVATION_SALT
    target: secret:AR_ENCRYPTION_KEY_DERIVATION_SALT
    required: true
    generate: alnum32
companions:
  - id: immich
    blurb: Photo & video library — Once makes its films from the people and videos in Immich.
    default: true
firstParty: once
about: |-
  Once makes One Second Everyday films from the household's Immich library. Pick the people — or a group of them — and a stretch of dates, and Once lays out every day they appear on a calendar: one second from each video, a slow Ken Burns move across each photo, and a Live Photo's motion where there is one.

  Drag a second to another day, choose which second of a clip to keep, preview the whole film, then add music and export one MP4 to the household's video library. Immich keeps the originals; Once only keeps the choices you made.
highlights:
  - People and groups straight from Immich's faces
  - A calendar of days, rearranged by dragging
  - The exact second of each video, and the move across each photo
  - Music from an upload, a YouTube link, or the household's library, ducked under the originals
  - Landscape or portrait films, saved to Videos or back into an Immich album
logo: tile.svg
developer: Built from your own repository
license: Private
footprint:
  memory: 629145600
  memoryPeak: 2097152000
  cpu: heavy
  cpuWhen: rendering a film
  disk: 1258291200
  diskGrows: with the render cache, up to ONCE_CACHE_MAX_GB
