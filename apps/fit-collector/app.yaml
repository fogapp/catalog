id: fit-collector
title: Fit Collector
description: Fetches Whoop and Withings data for Fit — it holds the vendor tokens, and has no way to read Fit.
category: Personal cloud
icon: '📥'
spec:
  source:
    type: git
    branch: main
    dockerfile: Dockerfile
    buildArgs:
      GIT_REV: '{{commit}}'
  env:
    COLLECTOR_DATA: /data
    COLLECTOR_HOST: '{{fqdn}}'
    RACK_ENV: production
  secrets:
    - COLLECTOR_KEY
  volumes:
    - name: data
      mount: /data
      owner: 1000:1000
  routes:
    - port: 80
      lanOnly: true
  health:
    path: /up
  command:
    - ./bin/collector
  updatePolicy: auto
  backup:
    enabled: true
    beforeUpdate: false
  notes: 'Register apps with Whoop and Withings using the redirect URIs https://<this app''s address>/oauth/whoop/callback and /oauth/withings/callback, checking first that each vendor accepts a hostname on a LAN address. Then add WHOOP_CLIENT_ID, WHOOP_CLIENT_SECRET, WITHINGS_CLIENT_ID and WITHINGS_CLIENT_SECRET in Config → Secrets and redeploy. Keep this app named fit-collector: Fit asks for it by name. COLLECTOR_KEY encrypts the vendor tokens stored here. Add the deploy key and webhook (Overview tab) to the Gitea repo for push-to-deploy.'
  memoryLimit: 256m
  connection:
    port: 80
    offers:
      - id: pull
        title: Vendor data
        blurb: Fit can collect what this has fetched from Whoop and Withings. Nothing else can.
        env:
          FIT_COLLECTOR_URL: '{{url}}'
        secrets:
          - FIT_COLLECTOR_TOKEN
  sealedPeer: true
options:
  - key: repo
    label: Git repository
    target: repo
    required: true
  - key: COLLECTOR_KEY
    label: COLLECTOR_KEY
    hint: Encrypts the vendor tokens stored here; changing it makes them unreadable.
    target: secret:COLLECTOR_KEY
    required: true
    generate: hex64
firstParty: fit
about: |-
  Fit Collector is the one part of Fit with internet access. It holds the Whoop and Withings tokens and fetches on a schedule, so that Fit itself never needs a route out of the machine.

  It has no database and none of Fit's secrets. Fit pulls from it over a token only Fit can ask for, and nothing flows the other way.
highlights:
  - Holds the vendor tokens, encrypted, apart from Fit
  - No database and no way to read Fit
  - Offers its data to Fit alone
logo: tile.svg
developer: Built from your own repository
license: Private
footprint:
  memory: 83886080
  memoryPeak: 268435456
  cpu: light
  disk: 1258291200
