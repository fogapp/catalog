id: office
title: Office
description: Document editor — a Docs/Word stand-in with .docx, Markdown and PDF support, collaboration and history.
category: Personal cloud
icon: '📝'
spec:
  source:
    type: git
    branch: main
    buildArgs:
      GIT_REV: '{{commit}}'
  env:
    GIT_REV: '{{commit}}'
    GOTENBERG_URL: http://gotenberg:3000
    OFFICE_HOST: '{{fqdn}}'
    SOLID_QUEUE_IN_PUMA: "1"
  secrets:
    - SECRET_KEY_BASE
    - AR_ENCRYPTION_PRIMARY_KEY
    - AR_ENCRYPTION_DETERMINISTIC_KEY
    - AR_ENCRYPTION_KEY_DERIVATION_SALT
  volumes:
    - name: storage
      mount: /rails/storage
      owner: 1000:1000
    - name: files
      mount: /rails/files
      files: Content/Documents
      owner: 1000:1000
  routes:
    - port: 80
  health:
    path: /up
  release:
    - ./bin/rails
    - fog:release
  needs:
    postgres:
      databases:
        - office_production
        - office_production_cache
        - office_production_queue
        - office_production_cable
      extensions:
        - pg_trgm
      inject:
        DATABASE_HOST: host
        DATABASE_PASSWORD: password
        DATABASE_PORT: port
        DATABASE_USER: user
  backup:
    enabled: true
    mode: delegated
    timeout: 45m
  notes: 'First run: open the app and the setup wizard creates your household and admin account — or restores a fog-backup/1 artifact from a previous instance. Install Gotenberg alongside for exact PDF export and .doc/.odt/.rtf import; Office detects it through GOTENBERG_URL.'
  reach:
    - gotenberg
options:
  - key: repo
    label: Git repository
    target: repo
    required: true
  - key: SECRET_KEY_BASE
    label: SECRET_KEY_BASE
    hint: Signs cookies and ActiveStorage URLs; unique per instance.
    target: secret:SECRET_KEY_BASE
    required: true
    generate: hex128
  - key: AR_ENCRYPTION_PRIMARY_KEY
    label: AR_ENCRYPTION_PRIMARY_KEY
    hint: Encrypts sensitive database columns from day one.
    target: secret:AR_ENCRYPTION_PRIMARY_KEY
    required: true
    generate: alnum32
  - key: AR_ENCRYPTION_DETERMINISTIC_KEY
    label: AR_ENCRYPTION_DETERMINISTIC_KEY
    target: secret:AR_ENCRYPTION_DETERMINISTIC_KEY
    required: true
    generate: alnum32
  - key: AR_ENCRYPTION_KEY_DERIVATION_SALT
    label: AR_ENCRYPTION_KEY_DERIVATION_SALT
    target: secret:AR_ENCRYPTION_KEY_DERIVATION_SALT
    required: true
    generate: alnum32
companions:
  - id: gotenberg
    blurb: Chromium + LibreOffice conversion API — exact PDF export and legacy document formats for Office.
firstParty: office
about: |-
  Office is a document editor for a household: a private place to write, keep, and share the letters, reports, and notes a family accumulates, with a real word processor in the browser rather than a text box.

  Documents open from and save back to the household's own files — .docx, Markdown, plain text, HTML, PDF — so nothing is locked in, and every edit is autosaved and versioned so nothing is lost.
highlights:
  - 'A document window: menu bar, toolbar, ruler, paper, and a command palette'
  - Headings, lists, tables, images, footnotes, a table of contents, page setup
  - Several people in one document at once, with presence and remote cursors
  - Revision history with named versions, rendered diffs, and one-click restore
  - Comments anchored to a passage, with mentions, replies, and resolve
  - Exact PDF export and legacy formats through Gotenberg
logo: tile.svg
developer: Built from your own repository
license: Private
footprint:
  memory: 734003200
  memoryPeak: 1572864000
  cpu: light
  disk: 1258291200
  diskGrows: with your documents
