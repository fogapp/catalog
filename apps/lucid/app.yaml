id: lucid
title: Lucid
description: Observability for every app on this server — metrics, traces, logs, profiles, and visitor analytics behind one query bar.
category: Utilities
icon: '🔭'
spec:
  source:
    type: git
    branch: main
    dockerfile: Dockerfile
    buildArgs:
      GIT_REV: '{{commit}}'
  env:
    GIT_SHA: '{{commit}}'
    JOB_CONCURRENCY: "1"
    LUCID_HOST: '{{fqdn}}'
    LUCID_URL: http://lucid
    RAILS_ENV: production
    RAILS_MAX_THREADS: "8"
    TIME_ZONE: America/Los_Angeles
  secrets:
    - SECRET_KEY_BASE
    - AR_ENCRYPTION_PRIMARY_KEY
    - AR_ENCRYPTION_DETERMINISTIC_KEY
    - AR_ENCRYPTION_KEY_DERIVATION_SALT
    - LUCID_API_KEY
  volumes:
    - name: storage
      mount: /rails/storage
      owner: 1000:1000
  routes:
    - port: 80
  health:
    path: /up
  processes:
    - name: worker
      command:
        - ./bin/jobs
  release:
    - ./bin/rails
    - fog:release
  deployStrategy: swap
  needs:
    postgres:
      databases:
        - lucid_production
        - lucid_production_telemetry
        - lucid_production_cache
        - lucid_production_queue
      extensions:
        - pg_trgm
        - citext
        - pgcrypto
      inject:
        DATABASE_HOST: host
        DATABASE_NAME: dbname
        DATABASE_PASSWORD: password
        DATABASE_PORT: port
        DATABASE_USER: user
  updatePolicy: auto
  backup:
    enabled: true
    beforeUpdate: true
    mode: delegated
    timeout: 20m
  notes: 'First visit: complete the setup wizard to create the household and admin account — or restore a fog-backup/1 artifact from a previous instance. Then open each app to watch, and on its Integrations tab connect Lucid: fog has Lucid mint that app its own ingest key and a read-only token, sets LUCID_URL, LUCID_API_KEY and LUCID_READ_TOKEN, and redeploys it (a Rails app also needs the lucid gem). Connect it on Lucid''s own Integrations tab to have Lucid report on itself. Telemetry is kept within the disk budget in Settings › Retention and is not backed up. Add the deploy key and webhook (Overview tab) to the Gitea repo for push-to-deploy.'
  memoryLimit: 1536m
  sealedPeer: true
options:
  - key: repo
    label: Git repository
    target: repo
    required: true
  - key: lucid_api_key
    label: Lucid's own ingest key
    hint: So Lucid reports on itself. Blank until you connect Lucid on its own Integrations tab.
    target: secret:LUCID_API_KEY
    required: false
    advanced: true
  - key: SECRET_KEY_BASE
    label: SECRET_KEY_BASE
    hint: Signs cookies and ActiveStorage URLs; unique per instance.
    target: secret:SECRET_KEY_BASE
    required: true
    generate: hex128
  - key: AR_ENCRYPTION_PRIMARY_KEY
    label: AR_ENCRYPTION_PRIMARY_KEY
    hint: Encrypts sensitive database columns from day one.
    target: secret:AR_ENCRYPTION_PRIMARY_KEY
    required: true
    generate: alnum32
  - key: AR_ENCRYPTION_DETERMINISTIC_KEY
    label: AR_ENCRYPTION_DETERMINISTIC_KEY
    target: secret:AR_ENCRYPTION_DETERMINISTIC_KEY
    required: true
    generate: alnum32
  - key: AR_ENCRYPTION_KEY_DERIVATION_SALT
    label: AR_ENCRYPTION_KEY_DERIVATION_SALT
    target: secret:AR_ENCRYPTION_KEY_DERIVATION_SALT
    required: true
    generate: alnum32
companions:
  - id: ntfy
    blurb: Push notifications — Lucid sends its alerts to an ntfy topic (Settings › Notifications).
firstParty: lucid
about: |-
  Lucid is how you see through the fog: one console for everything the apps on this server are doing — metrics, request traces, logs, continuous profiles, and visitor analytics, all behind one query bar.

  An app opts in with an address, a key, and one Gemfile line, and reports from its next boot — no collector, no YAML, nothing to add to its frontend. Telemetry is kept within a disk budget you set and is left out of backups; the configuration is not.
highlights:
  - Requests, SQL, views, cache, jobs, and outbound HTTP, traced end to end
  - Logs and runtime vitals beside the traces they belong to
  - Continuous profiling with flamegraphs
  - Pageviews, clicks, and web vitals, relayed by the app itself
  - One query bar across every signal
  - Alerts to ntfy, and a disk budget for telemetry
logo: tile.svg
developer: Built from your own repository
license: Private
footprint:
  memory: 524288000
  memoryPeak: 805306368
  cpu: moderate
  cpuWhen: ingesting telemetry
  disk: 1258291200
  diskGrows: with telemetry, up to the budget in Settings › Retention
