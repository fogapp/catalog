id: stream
title: Stream
description: The household's video player — movies, shows, and everything else, played in the browser at original quality.
category: Media servers
icon: ▶️
spec:
  source:
    type: git
    branch: main
    dockerfile: Dockerfile
    buildArgs:
      GIT_REV: '{{commit}}'
  env:
    GIT_SHA: '{{commit}}'
    HTTP_WRITE_TIMEOUT: "0"
    JOB_CONCURRENCY: "1"
    LUCID_URL: http://lucid
    NTFY_TOPIC: stream
    NTFY_URL: http://ntfy
    RAILS_ENV: production
    RAILS_MAX_THREADS: "12"
    STREAM_CACHE_DIR: /cache
    STREAM_HOST: '{{fqdn}}'
    TIME_ZONE: America/Los_Angeles
    WEB_CONCURRENCY: "2"
  secrets:
    - SECRET_KEY_BASE
    - AR_ENCRYPTION_PRIMARY_KEY
    - AR_ENCRYPTION_DETERMINISTIC_KEY
    - AR_ENCRYPTION_KEY_DERIVATION_SALT
    - STREAM_TOKEN_KEY
  volumes:
    - name: storage
      mount: /rails/storage
      owner: 1000:1000
    - name: cache
      mount: /cache
      owner: 1000:1000
    - name: movies
      mount: /media/movies
      files: Content/Movies
    - name: tv
      mount: /media/tv
      files: Content/TV
    - name: videos
      mount: /media/videos
      files: Content/Videos
    - name: youtube
      mount: /media/youtube
      files: Content/YouTube
  routes:
    - port: 80
  health:
    path: /up
  processes:
    - name: worker
      command:
        - ./bin/jobs
    - name: transcoder
      command:
        - ./bin/transcoder
  release:
    - ./bin/rails
    - fog:release
  deployStrategy: swap
  needs:
    postgres:
      databases:
        - stream_production
        - stream_production_cache
        - stream_production_queue
      extensions:
        - pg_trgm
        - citext
        - pgcrypto
        - unaccent
        - vector
      inject:
        DATABASE_HOST: host
        DATABASE_NAME: dbname
        DATABASE_PASSWORD: password
        DATABASE_PORT: port
        DATABASE_USER: user
  updatePolicy: auto
  backup:
    enabled: true
    beforeUpdate: true
    mode: delegated
    timeout: 30m
  notes: 'First visit: complete the setup wizard to create the household and admin account — or restore a fog-backup/1 artifact from a previous instance. Then Settings › Libraries (point a library at each folder under /media) and Settings › Integrations (a TMDB key for metadata; optionally Sonarr/Radarr webhooks and a Plex server to migrate watch history from). Stream only reads your media folders. Add the deploy key and webhook (Overview tab) to the Gitea repo for push-to-deploy.'
  memoryLimit: 3g
  reach:
    - ntfy
  connection:
    port: 80
    shares:
      - movies
      - tv
      - videos
      - youtube
options:
  - key: repo
    label: Git repository
    target: repo
    required: true
  - key: movies
    label: Movies folder
    hint: Mounted read at /media/movies.
    target: volume:movies
    required: false
  - key: tv
    label: TV folder
    hint: Mounted read at /media/tv.
    target: volume:tv
    required: false
  - key: videos
    label: Videos folder
    hint: Everything that isn't a film or a series — YouTube archives, home videos. Mounted at /media/videos.
    target: volume:videos
    required: false
  - key: youtube
    label: YouTube downloads folder
    hint: Where Stream saves the YouTube channels it follows (it writes here). Mounted at /media/youtube.
    target: volume:youtube
    required: false
  - key: SECRET_KEY_BASE
    label: SECRET_KEY_BASE
    hint: Signs cookies and ActiveStorage URLs; unique per instance.
    target: secret:SECRET_KEY_BASE
    required: true
    generate: hex128
  - key: AR_ENCRYPTION_PRIMARY_KEY
    label: AR_ENCRYPTION_PRIMARY_KEY
    hint: Encrypts sensitive database columns from day one.
    target: secret:AR_ENCRYPTION_PRIMARY_KEY
    required: true
    generate: alnum32
  - key: AR_ENCRYPTION_DETERMINISTIC_KEY
    label: AR_ENCRYPTION_DETERMINISTIC_KEY
    target: secret:AR_ENCRYPTION_DETERMINISTIC_KEY
    required: true
    generate: alnum32
  - key: AR_ENCRYPTION_KEY_DERIVATION_SALT
    label: AR_ENCRYPTION_KEY_DERIVATION_SALT
    target: secret:AR_ENCRYPTION_KEY_DERIVATION_SALT
    required: true
    generate: alnum32
  - key: STREAM_TOKEN_KEY
    label: STREAM_TOKEN_KEY
    hint: Signs media URLs; rotating it ends every playback session.
    target: secret:STREAM_TOKEN_KEY
    required: true
    generate: hex64
companions:
  - id: sonarr
    blurb: TV series management — Stream picks up new episodes from Sonarr's webhooks.
  - id: radarr
    blurb: Movie management — Stream picks up new films from Radarr's webhooks.
  - id: ntfy
    blurb: Push notifications — Stream publishes library and health alerts to ntfy.
firstParty: stream
about: |-
  Stream is the household's video player. It reads the video already on the network — movies, shows, and everything that is neither: YouTube archives, home videos, lectures, concerts — and plays it in the browser instantly, at original quality whenever the browser can take it.

  It takes Plex's polish, Jellyfin's openness, and YouTube's grammar for loose video, and adds the thing none of them have: a player that tells you why it did what it did. It only ever reads your media folders; everything it learns lives in its own database.
highlights:
  - Movies, shows, and loose video each browse the way they should
  - Direct play first — transcoding is a last resort, and explained
  - Files identified by content, so renames never lose watch history
  - Continue watching and resume everywhere, per profile
  - Metadata and artwork from TMDB, new arrivals from Sonarr and Radarr webhooks
  - Watch history and positions migrated from Plex
logo: tile.svg
developer: Built from your own repository
license: Private
footprint:
  memory: 734003200
  memoryPeak: 3145728000
  cpu: heavy
  cpuWhen: transcoding video
  disk: 1258291200
  diskGrows: with artwork and trickplay for your library
