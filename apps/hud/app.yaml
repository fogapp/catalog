id: hud
title: HUD
description: Brings calendars, webhooks, and agents to the edge of attention — a BusyBar on the desk, a phone, the room's lights — without interrupting work.
category: Personal cloud
icon: '🔔'
spec:
  source:
    type: git
    branch: main
    dockerfile: Dockerfile
    buildArgs:
      GIT_REV: '{{commit}}'
  env:
    HUD_PUBLIC_URL: https://{{fqdn}}
  secrets:
    - HUD_MASTER_KEY
    - GOOGLE_OAUTH_CLIENT_ID
    - GOOGLE_OAUTH_CLIENT_SECRET
  routes:
    - port: 8080
      noBuffer: true
      auth: true
    - host: hud-api
      port: 8081
      noBuffer: true
  health:
    path: /healthz
  deployStrategy: swap
  needs:
    postgres:
      databases:
        - hud
      inject:
        DATABASE_HOST: host
        DATABASE_NAME: dbname
        DATABASE_PASSWORD: password
        DATABASE_PORT: port
        DATABASE_USER: user
  updatePolicy: auto
  notes: The console is at this app's address behind Fog's login; machine endpoints (webhooks, MCP, ntfy actions) are at hud-api.<domain> and need a token from Settings → API tokens. HUD_MASTER_KEY encrypts every credential HUD stores — changing it makes them unreadable, so keep it with your backups. For Google Calendar, set GOOGLE_OAUTH_CLIENT_ID and GOOGLE_OAUTH_CLIENT_SECRET in Config → Secrets and redeploy; CalDAV and ICS feeds need neither. Apps run on bridge networking, so add the BusyBar by IP (give it a DHCP reservation) or use Scan on the Surfaces page. Add the deploy key and webhook (Overview tab) to the Gitea repo for push-to-deploy.
  uses:
    - events
options:
  - key: repo
    label: Git repository
    target: repo
    required: true
  - key: HUD_MASTER_KEY
    label: HUD_MASTER_KEY
    hint: Encrypts stored credentials; changing it makes them unreadable.
    target: secret:HUD_MASTER_KEY
    required: true
    generate: hex64
  - key: google_client_id
    label: Google OAuth client ID
    hint: Only for Google Calendar sources. Blank until you have a client.
    target: secret:GOOGLE_OAUTH_CLIENT_ID
    required: false
    advanced: true
  - key: google_client_secret
    label: Google OAuth client secret
    target: secret:GOOGLE_OAUTH_CLIENT_SECRET
    required: false
    advanced: true
companions:
  - id: ntfy
    blurb: Push notifications — HUD's phone surface, with action buttons that call back into HUD.
  - id: homeassistant
    blurb: Home automation — HUD drives the room's lights and reacts to sensors changing.
  - id: sabnzbd
    blurb: Usenet downloader — HUD hears when a download finishes or fails.
firstParty: hud
about: |-
  HUD brings timely information to the edge of attention without interrupting work. It connects sources — calendars, webhooks, agents — to surfaces — a BusyBar on the desk, a phone, the room's lights — through one pipeline of rules, so the next meeting counts down quietly instead of popping up over what you are doing.

  Every notice can be traced back to the event and the rule that raised it, and rules are edited and simulated live in the console.
highlights:
  - Google Calendar, CalDAV, and ICS feeds
  - CloudEvents webhooks and MCP for agents
  - 'BUSY Bar: native countdown, details, LED, chime, and buttons'
  - Phone notices through ntfy, room lights through Home Assistant
  - Rules in CEL with a live editor and simulator
  - A trace of why every notice appeared
logo: tile.svg
developer: Built from your own repository
license: Private
footprint:
  memory: 104857600
  memoryPeak: 314572800
  cpu: light
  disk: 104857600
